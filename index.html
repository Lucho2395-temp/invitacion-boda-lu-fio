<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Luis & Fiorelita — 26.09.2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Allura&family=Cormorant+Garamond:ital@1&family=Great+Vibes&family=Italiana&family=Parisienne&family=Pinyon+Script&family=Playfair+Display:ital@1&family=Tangerine:wght@700&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">

<body>

  <!-- SOBRE DE APERTURA (pantalla inicial) -->

  <span class="intro-datelabel">26 Septiembre 2026 · Perú</span>

      <div class="env-back"></div>
      <div class="letter">
        <span class="amp">L&amp;F</span>
        <span class="names">Luis &amp; Fiorelita</span>
        <span class="ldate">26 · 09 · 2026</span>
      </div>
      <div class="env-front"></div>
      <div class="env-flap"></div>
      <div class="seal"><span>L</span><span>&amp;</span><span>F</span></div>
    </div>
  </div>

  <div class="intro-guest" id="introGuest">
    <span class="guest-name" id="guestName"></span>
    <span class="guest-seats" id="guestSeats"></span>
  </div>

  <span class="intro-hint">Haz clic en el sobre para ver la invitación</span>

<script src="js/script.js"></script>
